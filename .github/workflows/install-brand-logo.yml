name: Embed Child Astrology logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-brand-logo.yml'

permissions:
  contents: write

jobs:
  embed-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed logo directly in HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          index = Path('index.html')
          logo = Path('assets/child-astrology-logo.webp')
          html = index.read_text(encoding='utf-8')
          data = base64.b64encode(logo.read_bytes()).decode('ascii')
          uri = 'data:image/webp;base64,' + data

          html, count = re.subn(
              r'(<img class="brand-logo" src=")[^"]+(" alt="Child Astrology · Ella Kristioglo">)',
              lambda m: m.group(1) + uri + m.group(2),
              html,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected one brand logo image, replaced {count}')

          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit embedded logo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Embed Child Astrology logo in page"
          git push
