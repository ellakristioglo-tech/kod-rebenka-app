name: Use PNG Child Astrology logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-brand-logo.yml'

permissions:
  contents: write

jobs:
  use-png-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace header logo source with PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          html, count = re.subn(
              r'(<img class="brand-logo" src=")[^"]+(" alt="Child Astrology · Ella Kristioglo">)',
              r'\1assets/child-astrology-logo.png\2',
              html,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected one brand logo image, replaced {count}')

          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit PNG logo source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use PNG logo in header for Safari"
          git push
